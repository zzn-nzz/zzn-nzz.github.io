  <p>
    Hi! I am a first-year PhD student in EECS at UC Berkeley, affiliated with <a href="https://humancompatible.ai/" target="_blank">CHAI</a> and <a href="http://bair.berkeley.edu/" target="_blank">BAIR</a>. I am currently working with Professor <a href="https://serinachang5.github.io/" target="_blank">Serina Chang</a>.
  </p>
  <p>
    I work on human-centered AI. I am currently interested in human simulation and building better assistants that serve human interests.
  </p>
  <p>
    I am deeply greatful to the amazing mentors, professors, and collaborators I've worked with, for their invaluable guidance and support along the way.
